name: Build Lumen OS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ISO
        run: bash build.sh docker

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: lumen-os-iso
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-os-build-log
          path: out/build.log
          if-no-files-found: ignore
